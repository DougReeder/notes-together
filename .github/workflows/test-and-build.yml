name: test-and-build
on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  build:
    name: test & build - node.js
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        # Support LTS versions based on https://nodejs.org/en/about/releases/
        node-version: ['24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: static checks
        run: npm run prebuild
      - name: Run automated tests
        run: npm test
      - name: Run vite & rollup
        run: npm run build
      - name: push archive to S3
        uses: jakejarvis/s3-sync-action@be0c4ab89158cac4278689ebedd8407dd5f35a83
        if: ${{ matrix.node-version == '24' && github.ref == 'refs/heads/main' && github.repository == 'DougReeder/notes-together' }}
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ vars.AWS_S3_ENDPOINT }}
          SOURCE_DIR: 'dist'      # optional: defaults to entire repository
          DEST_DIR: 'notestogether'
